<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vortexx — игры, стримы и ссылки</title>
<meta name="description" content="Мой Telegram-канал, Instagram и всё остальное в одном месте.">
<meta name="theme-color" content="#0b0620">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0620; --panel:#150d33; --line:#2c1f5e;
    --text:#f1ecff; --muted:#9a8fc7;
    --pink:#ff3d9a; --cyan:#27e6ff; --violet:#8a5cff;
  }
  *{box-sizing:border-box;margin:0}
  html{background:var(--bg)}
  body{
    min-height:100vh; color:var(--text);
    font-family:"Rubik",system-ui,sans-serif;
    background:
      radial-gradient(60% 40% at 50% 0%, #2a1470 0%, transparent 70%),
      var(--bg);
    overflow-x:hidden;
  }
  #vortex{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:56px 20px 40px}

  /* hero */
  .hero{text-align:center;margin-bottom:34px}
  .logo{
    width:112px;height:112px;margin:0 auto 22px;border-radius:50%;
    display:grid;place-items:center;font-size:52px;position:relative;
    background:var(--panel);
    box-shadow:0 0 0 2px var(--line), 0 0 40px rgba(138,92,255,.55);
  }
  .logo::before{
    content:"";position:absolute;inset:-8px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--pink),var(--cyan),var(--violet),var(--pink));
    -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);
            mask:radial-gradient(circle,transparent 60%,#000 62%);
    animation:spin 4s linear infinite;
  }
  .logo span{display:block;animation:spin 6s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}

  h1{
    font-family:"Russo One",sans-serif;font-weight:400;
    font-size:clamp(44px,13vw,72px);letter-spacing:.04em;line-height:1;
    position:relative;display:inline-block;
    text-shadow:0 0 24px rgba(138,92,255,.7);
  }
  h1::before,h1::after{
    content:attr(data-t);position:absolute;inset:0;overflow:hidden;
  }
  h1::before{color:var(--cyan);transform:translateX(-3px);clip-path:inset(0 0 55% 0);animation:glitch 5s infinite steps(1)}
  h1::after{color:var(--pink);transform:translateX(3px);clip-path:inset(55% 0 0 0);animation:glitch 5s infinite steps(1) .15s}
  @keyframes glitch{
    0%,90%,100%{opacity:0}
    92%{opacity:1;transform:translateX(-5px)}
    94%{opacity:1;transform:translateX(4px)}
    96%{opacity:0}
  }
  .tag{margin-top:14px;color:var(--muted);font-size:17px;min-height:26px}
  .tag b{color:var(--cyan);font-weight:500}
  .caret{display:inline-block;width:2px;height:1em;background:var(--cyan);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* links */
  .links{display:grid;gap:14px}
  .card{
    --c:var(--violet);
    position:relative;display:flex;align-items:center;gap:16px;
    padding:16px 18px;border-radius:16px;text-decoration:none;color:inherit;
    background:linear-gradient(135deg,rgba(21,13,51,.92),rgba(31,18,76,.85));
    border:1px solid var(--line);
    backdrop-filter:blur(6px);
    transition:transform .2s, border-color .2s, box-shadow .2s;
    overflow:hidden;
  }
  .card::after{ /* light sweep on hover */
    content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);
    transform:skewX(-20deg);transition:left .6s;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-3px) scale(1.015);
    border-color:var(--c);
    box-shadow:0 8px 30px -6px var(--c);
    outline:none;
  }
  .card:hover::after,.card:focus-visible::after{left:130%}
  .card:active{transform:scale(.98)}
  .ico{
    flex:none;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;
    background:var(--c);color:#fff;
  }
  .ico svg{width:26px;height:26px;fill:currentColor}
  .txt{flex:1;min-width:0}
  .txt strong{display:block;font-size:18px;font-weight:600}
  .txt small{display:block;margin-top:2px;color:var(--muted);font-size:14px}
  .card.tg{--c:#2aa9ee}
  .card.ig{--c:#e1306c}
  .card.me{--c:#27c6a7}
  .card.donate{--c:#ffb020}
  .card.slot{--c:var(--violet)}
  .card.donate .ico{color:#2a1500;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.1);box-shadow:0 0 22px rgba(255,176,32,.7)}}
  .card.ig .ico{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf)}
  .card.slot .ico{background:transparent;border:2px dashed var(--line);color:var(--muted)}
  .card.slot{opacity:.8}

  /* entrance: one orchestrated moment */
  .hero,.card{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
  .card:nth-child(1){animation-delay:.25s}.card:nth-child(2){animation-delay:.33s}
  .card:nth-child(3){animation-delay:.41s}.card:nth-child(4){animation-delay:.49s}
  .card:nth-child(5){animation-delay:.57s}.card:nth-child(6){animation-delay:.65s}
  @keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  footer{margin-top:36px;text-align:center;color:var(--muted);font-size:14px}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<canvas id="vortex" aria-hidden="true"></canvas>

<main>
  <header class="hero">
    <div class="logo"><span>🌀</span></div>
    <h1 data-t="VORTEXX">VORTEXX</h1>
    <p class="tag"><span id="typed"></span><span class="caret"></span></p>
  </header>

  <nav class="links" aria-label="Мои ссылки">

    <a class="card tg" href="https://t.me/vortexx_ua" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M21.900 3.300 2.700 10.700c-1 .4-1 1.100-.2 1.300l4.900 1.500 1.900 5.800c.2.600.4.800.9.800.4 0 .6-.2.900-.4l2.300-2.200 4.800 3.500c.9.500 1.500.2 1.700-.8l3-14.200c.3-1.200-.4-1.800-1.300-1.400zM9 13.200l9.700-6.100c.5-.3.9-.1.5.2L11.200 14.600l-.3 3.200z"/></svg></span>
      <span class="txt"><strong>Telegram-канал</strong><small>Новости, игры и анимации</small></span>
    </a>

    <a class="card ig" href="https://www.instagram.com/0vasja_ignatuk0/" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.500A4.500 4.500 0 1 1 7.500 12 4.500 4.500 0 0 1 12 7.500zm0 2A2.500 2.500 0 1 0 14.500 12 2.500 2.500 0 0 0 12 9.500zM17.300 5.800a1.100 1.100 0 1 1-1.100 1.100 1.100 1.100 0 0 1 1.100-1.100z"/></svg></span>
      <span class="txt"><strong>Instagram</strong><small>Фото и сторис</small></span>
    </a>

    <!-- Особистий Telegram -->
    <a class="card me" href="https://t.me/vortex_ua" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.400 0-8 2.200-8 5v1h16v-1c0-2.800-3.600-5-8-5z"/></svg></span>
      <span class="txt"><strong>Написать мне</strong><small>Личный Telegram</small></span>
    </a>

    <!-- Посилання на донат (Monobank) -->
    <a class="card donate" href="https://send.monobank.ua/jar/3kZyHYsabC" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 21.300 10.600 20C5.400 15.300 2 12.200 2 8.500A4.500 4.500 0 0 1 6.500 4 5 5 0 0 1 12 6.100 5 5 0 0 1 17.500 4 4.500 4.500 0 0 1 22 8.500c0 3.700-3.400 6.800-8.600 11.500z"/></svg></span>
      <span class="txt"><strong>Поддержать донатом</strong><small>Спасибо, что ты со мной</small></span>
    </a>

    <!-- СВОБОДНЫЙ СЛОТ 1 -->
    <a class="card slot" href="#" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></span>
      <span class="txt"><strong>Скоро здесь</strong><small>Место для новой ссылки</small></span>
    </a>

    <!-- СВОБОДНЫЙ СЛОТ 2 -->
    <a class="card slot" href="#" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></span>
      <span class="txt"><strong>Скоро здесь</strong><small>Место для новой ссылки</small></span>
    </a>

  </nav>

  <footer>© <span id="y"></span> Vortexx. Играй, смотри, оставайся рядом.</footer>
</main>

<script>
/* год в футере */
document.getElementById('y').textContent = new Date().getFullYear();

/* печатающаяся строка под названием */
(function(){
  const phrases = ['игры, которые затягивают','новые видео каждую неделю','заходи в канал и оставайся'];
  const el = document.getElementById('typed');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = phrases[0]; return; }
  let p = 0, i = 0, del = false;
  (function tick(){
    const s = phrases[p];
    el.textContent = s.slice(0, i);
    if (!del && i === s.length){ del = true; return setTimeout(tick, 1600); }
    if (del && i === 0){ del = false; p = (p + 1) % phrases.length; }
    i += del ? -1 : 1;
    setTimeout(tick, del ? 28 : 65);
  })();
})();

/* вихрь из частиц на фоне: частицы закручиваются к центру */
(function(){
  const c = document.getElementById('vortex'), ctx = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, cx, cy, R, parts = [];
  const colors = ['#ff3d9a','#27e6ff','#8a5cff'];

  function resize(){
    const d = Math.min(devicePixelRatio || 1, 2);
    W = c.width = innerWidth * d; H = c.height = innerHeight * d;
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(d,d);
    W = innerWidth; H = innerHeight;
    cx = W / 2; cy = H * 0.22; R = Math.hypot(W, H) * 0.7;
    const n = Math.round(Math.min(160, W / 7));
    parts = Array.from({length:n}, spawn);
  }
  function spawn(){
    return {
      a: Math.random() * Math.PI * 2,
      r: Math.random() * R,
      s: 0.4 + Math.random() * 1.2,
      z: 0.8 + Math.random() * 1.8,
      col: colors[(Math.random() * 3) | 0]
    };
  }
  function frame(){
    ctx.fillStyle = 'rgba(11,6,32,.18)';
    ctx.fillRect(0, 0, W, H);
    for (const p of parts){
      p.a += 0.004 * p.s + 0.6 / (p.r + 60);
      p.r -= 0.35 * p.s;
      if (p.r < 10){ Object.assign(p, spawn(), {r: R}); }
      const x = cx + Math.cos(p.a) * p.r, y = cy + Math.sin(p.a) * p.r * 0.55;
      ctx.beginPath();
      ctx.fillStyle = p.col;
      ctx.globalAlpha = Math.min(1, p.r / 120) * 0.8;
      ctx.arc(x, y, p.z, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);
  resize();
  ctx.fillStyle = '#0b0620'; ctx.fillRect(0, 0, W, H);
  frame();
})();
</script>
</body>
